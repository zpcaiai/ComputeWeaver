name: Verify
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: computeweaver-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: computeweaver
          POSTGRES_USER: computeweaver
          POSTGRES_PASSWORD: integration-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U computeweaver -d computeweaver"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      COMPUTEWEAVER_TEST_DATABASE_URL: postgresql://computeweaver:integration-only@127.0.0.1:5432/computeweaver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.lock
      - run: .venv/bin/pip install -e . --no-deps --no-build-isolation
      - run: npm --prefix apps/web ci --include=optional --registry=https://registry.npmjs.org
      - run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - run: make verify
      - run: make test-integration
      - run: make evidence
      - run: .venv/bin/certify external-status --commit "${{ github.sha }}" --release-id local-candidate
      - run: docker build -f deploy/compose/Dockerfile -t computeweaver:${{ github.sha }} .
      - name: Non-root read-only image smoke
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            --user 65532:65532 \
            -e COMPUTEWEAVER_ENV=simulator \
            -e COMPUTEWEAVER_DATABASE_URL=memory:// \
            -e COMPUTEWEAVER_AUTH_MODE=trusted_headers \
            computeweaver:${{ github.sha }} \
            python -c "from apps.api.main import app; assert len(app.routes) >= 80"
      - name: Full Compose startup and routed API smoke
        run: |
          docker compose -f deploy/compose/docker-compose.yml up -d --build --wait postgres object-store api web worker
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
          curl --fail --silent --show-error http://127.0.0.1:8080/web-health/live
          curl --fail --silent --show-error \
            -H 'X-Tenant-Id: tenant-ci' -H 'X-Actor-Id: ci-smoke' -H 'X-Roles: admin' \
            http://127.0.0.1:8080/v1/certification/local-candidate
      - name: Compose diagnostics and cleanup
        if: always()
        run: |
          docker compose -f deploy/compose/docker-compose.yml ps
          docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail=200
          docker compose -f deploy/compose/docker-compose.yml down --volumes --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: computeweaver-evidence
          path: evidence/
          if-no-files-found: error

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --strict -r requirements.runtime.lock
      - run: npm --prefix apps/web ci --include=optional --registry=https://registry.npmjs.org
      - run: npm --prefix apps/web audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
